<!doctype html>

<title>제주 관광지·명소</title>
<style>
  :root {

    --shadow: 0 2px 10px rgba(20, 60, 50, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101816; --card: #18231f; --text: #e7f0ec; --muted: #9fb3ac;
      --accent: #3fc9a2; --accent-soft: #1f3a32; --line: #2a3b35;
      --shadow: 0 2px 10px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; line-height: 1.5; }
  header { padding: 40px 16px 20px; text-align: center; }
  header h1 { margin: 0 0 6px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
  header p { margin: 0; color: var(--muted); }
  .tools { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .tools-inner { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  #q { width: 100%; padding: 10px 14px; font-size: 1rem; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--text); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: .9rem; }
  .chip .n { color: var(--muted); margin-left: 4px; font-size: .8rem; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip[aria-pressed="true"] .n { color: #e6fff6; }
  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 60px; }
  section { margin-top: 36px; scroll-margin-top: 120px; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 14px; }
  .sec-head h2 { margin: 0; font-size: 1.35rem; }
  .sec-head small { color: var(--muted); font-size: .85rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
    display: flex; flex-direction: column; }
  .thumb { position: relative; aspect-ratio: 4 / 3; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 4.2rem; }
  .badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.65); color: #fff;
    font-size: .78rem; padding: 2px 8px; border-radius: 999px; }
  .pick { position: absolute; top: 8px; left: 8px; background: var(--star); color: #fff;
    font-size: .78rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .body { padding: 12px 14px 14px; }
  .body h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .body p { margin: 0; color: var(--muted); font-size: .88rem; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .tag { flex: none; background: var(--accent-soft); color: var(--accent); font-size: .75rem;
    padding: 2px 8px; border-radius: 999px; }
  .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .src { display: inline-block; margin-top: 8px; font-size: .8rem; color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 40px; }
</style>
</head>

  '사려니숲길': '🌲', '카멜리아힐': '🌺', '휴애리 자연생활공원': '🐑', '한림공원': '🌴', '생각하는정원': '🪴',
  '제주 에코랜드 테마파크': '🚂', '오설록 티뮤지엄': '🍵', '아쿠아플라넷 제주': '🐠', '본태박물관': '🏛️',
  '김영갑갤러리 두모악': '📷', '제주 돌문화공원': '🗿', '제주민속촌': '🏡', '성읍민속마을': '🛖',
  '제주4·3평화공원': '🕊️', '방주교회': '⛪', '산방산': '⛰️', '송악산': '🌄', '새별오름': '🌾',
  '금오름': '🌇', '용눈이오름': '🌿', '다랑쉬오름': '🌋', '산굼부리': '🕳️', '거문오름': '🥾',
  '도두봉': '✈️', '용두암': '🐲', '외돌개': '🪨', '새연교': '🌉', '이호테우해변': '🐎',
  '월정리해변': '🏝️', '김녕해수욕장': '🌬️', '세화해변': '🎪', '삼양검은모래해변': '⚫', '중문색달해변': '🏄‍♂️',
  '동문시장': '🐷', '서귀포매일올레시장': '🍊', '이중섭거리': '🎨', '마라도': '🧭'
};

let DATA = null, activeCat = '전체', keyword = '';

function matches(it) {
  if (activeCat !== '전체' && it.category !== activeCat) return false;
  if (!keyword) return true;
  return (it.name + ' ' + it.description + ' ' + it.category).toLowerCase().includes(keyword);
}

function card(it) {
  const el = document.createElement('article');
  el.className = 'card';
  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  thumb.innerHTML = `<span aria-hidden="true">${EMOJI[it.name] || CAT_ICON[it.category] || '📍'}</span>` +
    (it.selected ? '<span class="pick">★ 추천</span>' : '') +
    `<span class="badge">${it.score}점</span>`;
  const body = document.createElement('div');
  body.className = 'body';
  const h = document.createElement('h3'); h.textContent = it.name;
  const p = document.createElement('p'); p.textContent = it.description;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span class="tag"></span><span class="bar"><i style="width:${it.score}%"></i></span>`;
  meta.querySelector('.tag').textContent = it.category;
  body.append(h, p, meta);
  if (it.source && /^https?:\/\//.test(it.source)) {
    const s = document.createElement('a');
    s.className = 'src'; s.textContent = '출처 보기'; s.href = it.source; s.target = '_blank'; s.rel = 'noopener';
    body.append(s);
  }
  el.append(thumb, body);
  return el;
}

function render() {
  const main = document.getElementById('main');
  main.replaceChildren();
  const groups = new Map();
  DATA.items.forEach(it => {
    if (!matches(it)) return;
    if (!groups.has(it.category)) groups.set(it.category, []);
    groups.get(it.category).push(it);
  });
  if (!groups.size) { main.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>'; return; }
  const order = [...groups.keys()].sort((a, b) => groups.get(b).length - groups.get(a).length);
  for (const cat of order) {
    const list = groups.get(cat).sort((a, b) => b.score - a.score);
    const avg = Math.round(list.reduce((s, x) => s + x.score, 0) / list.length);
    const sec = document.createElement('section');
    sec.id = 'cat-' + cat;
    sec.innerHTML = `<div class="sec-head"><h2>${CAT_ICON[cat] || ''} ${cat}</h2>` +
      `<small>${list.length}곳 · 평균 ${avg}점 · 대표 ${list[0].name}</small></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    list.forEach(it => grid.append(card(it)));
    sec.append(grid);
    main.append(sec);
  }
}

function renderChips() {
  const counts = {};
  DATA.items.forEach(it => counts[it.category] = (counts[it.category] || 0) + 1);
  const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const box = document.getElementById('chips');
  box.replaceChildren();
  ['전체', ...cats].forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(c === activeCat));
    b.innerHTML = `${c}<span class="n">${c === '전체' ? DATA.items.length : counts[c]}</span>`;
    b.onclick = () => { activeCat = c; renderChips(); render(); };
    box.append(b);
  });
}

function start(d) {
  DATA = d;
  document.getElementById('title').textContent = d.topic;
  document.getElementById('sub').textContent = `${d.region} · 카테고리별 ${d.items.length}곳`;
  renderChips(); render();
  document.getElementById('q').addEventListener('input', e => {
    keyword = e.target.value.trim().toLowerCase(); render();
  });
}

fetch('jeju_attractions.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .catch(() => EMBEDDED)
  .then(start);
</script>
